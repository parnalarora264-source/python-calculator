<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Special ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff4b91,#ff6b6b,#ff9a9e,#fad0c4);
background-size:400% 400%;
animation:bg 8s ease infinite;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:350px;
background:white;
padding:35px;
border-radius:20px;
text-align:center;
box-shadow:0 15px 35px rgba(0,0,0,.25);
animation:pop .8s;
position:relative;
z-index:2;
}

@keyframes pop{
from{transform:scale(.5);opacity:0;}
to{transform:scale(1);opacity:1;}
}

h1{
color:#ff2d75;
margin-bottom:15px;
}

p{
font-size:18px;
margin-bottom:25px;
color:#444;
line-height:1.5;
}

button{
padding:12px 28px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
transition:.3s;
margin:8px;
}

#yes{
background:#ff2d75;
color:white;
}

#yes:hover{
transform:scale(1.1);
}

#no{
background:#ddd;
position:absolute;
}

.heart{
position:fixed;
color:red;
font-size:20px;
animation:float 5s linear infinite;
opacity:.8;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(.5);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh) scale(1.5);
opacity:0;
}
}

#result{
font-size:22px;
color:#ff2d75;
margin-top:20px;
font-weight:bold;
display:none;
}
</style>
</head>

<body>

<div class="card">

<h1>❤️ Hey Beautiful ❤️</h1>

<p>
From the day I met you,<br>
you became the reason behind my smile.<br><br>

Will you make me the happiest person?<br><br>

<b>Will You Be My Girlfriend? 💖</b>
</p>

<button id="yes">Yes 💕</button>
<button id="no">No 😅</button>

<div id="result">
Yayyyyy!! ❤️🥹<br>
You just made my day!!
</div>

</div>

<script>
const no=document.getElementById("no");
const yes=document.getElementById("yes");
const result=document.getElementById("result");

no.addEventListener("mouseover",()=>{
let x=Math.random()*(window.innerWidth-120);
let y=Math.random()*(window.innerHeight-60);
no.style.left=x+"px";
no.style.top=y+"px";
});

yes.onclick=()=>{
result.style.display="block";
yes.style.display="none";
no.style.display="none";
};

function hearts(){
const h=document.createElement("div");
h.className="heart";
h.innerHTML="❤";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(15+Math.random()*25)+"px";
document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},5000);
}

setInterval(hearts,250);
</script>

</body>
</html>
